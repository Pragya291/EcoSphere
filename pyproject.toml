[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosphere"
version = "0.1.0"
description = "EcoSphere Flask application"
requires-python = ">=3.12"
dependencies = [
    "flask",
    "python-dotenv",
    "firebase-admin",
    "openai",
    "requests",
    "pytest",
]

[tool.vercel]
entrypoint = "run:app"
